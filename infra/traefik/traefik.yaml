# Traefik Static Configuration for Small Software Cloud Ingress
api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "smallcloud_apps"

log:
  level: "INFO"
  format: "common"

accessLog: {}
