[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "small-software-cloud-api"
version = "0.1.0"
description = "Control plane for a small software cloud platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0", "asyncpg>=0.29,<1.0", "alembic>=1.13,<2.0",
  "arq>=0.26,<1.0", "redis>=5.0,<7.0", "pwdlib[argon2]>=0.2,<1.0", "PyJWT>=2.9,<3.0",
  "email-validator>=2.2,<3.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<2.0", "httpx>=0.27,<1.0", "ruff>=0.7,<1.0"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E9", "F"]
ignore = ["E501"]
